<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pianox - Note Practice</title>
</head>

<body>
  <h1 style="text-align:left; font-family:monospace; margin:1rem 0 0.5rem;">Virtual Piano
  </h1>
  <p style="text-align:left; font-family:monospace; font-size:1rem; margin:0 1rem 1rem;">
    Play with your mouse, your computer keyboard (A/Q SDFGHJKL + W/Z E TYU OP) or your midi keyboard
    <br><a href="index.html" style="color:#4a90d9;">&larr; Back to Home</a>
  </p>
  <div style="text-align:center; font-family:monospace; margin:1rem 0;">
    <label>Range:
      <select id="startNote"></select>
      <span> to </span>
      <select id="endNote"></select>
    </label>
    <label style="margin-left:1rem;">
      <input type="checkbox" id="excludeSharps"> Exclude #
    </label>
    <button id="newNoteBtn" style="margin-left:1rem; padding:0.5rem 1rem;">New Note</button>
    <button id="replayBtn" style="margin-left:0.5rem; padding:0.5rem 1rem;">Replay</button>
  </div>
  <div id="pianoContainer"></div>
  <div id="triesDisplay"
    style="text-align:center; font-family:monospace; font-size:1rem; margin-top:1rem; min-height:1.5rem; color:#555;"></div>
  <div id="resultDisplay"
    style="text-align:center; font-family:monospace; font-size:2rem; margin-top:0.5rem; min-height:2.5rem; color:green; font-weight:bold;"></div>
  <div id="noteDisplay"
    style="text-align:center; font-family:monospace; font-size:1.5rem; margin-top:0.5rem; min-height:2rem;"></div>
  <div id="historyDisplay"
    style="font-family:monospace; font-size:1.2rem; margin-top:1rem; padding-left:1rem; display:flex; flex-direction:column-reverse; gap:0.3rem; align-items:flex-start;"></div>

  <!-- use importmap for github page -->
  <script type="importmap">
    {
      "imports": {
        "piano-chart": "https://cdn.skypack.dev/piano-chart",
        "tone": "https://cdn.skypack.dev/tone"
      }
    }
  </script>
  <script type="module" src="piano-notes-only.js"></script>
</body>

</html>
