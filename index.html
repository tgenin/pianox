<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pianox</title>
</head>

<body>
  <div id="pianoContainer"></div>
  <div id="noteDisplay" style="text-align:center; font-family:monospace; font-size:1.5rem; margin-top:1rem; min-height:2rem;"></div>
  <div id="chordDisplay" style="text-align:center; font-family:monospace; font-size:2rem; font-weight:bold; margin-top:0.5rem; min-height:2.5rem; color:#4a90d9;"></div>

  <!-- use importmap for github page -->
  <script type="importmap">
    {
      "imports": {
        "piano-chart": "https://cdn.skypack.dev/piano-chart",
        "tone": "https://cdn.skypack.dev/tone"
      }
    }
  </script>
  <script type="module" src="piano.js"></script>
</body>

</html>
